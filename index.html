<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Länderübersicht</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#141b31;--line:#25304d;--text:#eaf0ff;--muted:#9fb0d0;--accent:#5b8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.92);backdrop-filter:blur(14px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 10px}
.controls{display:flex;gap:8px}
input,select{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font-size:16px}
select{flex:0 0 auto}
main{padding:12px 12px 40px}
.status{color:var(--muted);font-size:14px;margin:6px 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.top{display:flex;gap:10px;align-items:center}
.flag{font-size:30px;line-height:1}
.name{font-weight:700;font-size:17px}
.region{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.item{background:#0f162b;border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.v{font-size:14px;margin-top:2px;word-break:break-word}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
a{color:var(--accent);text-decoration:none;font-size:13px;background:#0f162b;border:1px solid var(--line);padding:7px 10px;border-radius:999px}
.note{color:var(--muted);font-size:13px;margin:0 2px 14px}
</style>
</head>
<body>
<header>
<h1>🌍 Länderübersicht</h1>
<div class="controls">
<input id="q" type="search" placeholder="Land, Hauptstadt oder Sprache suchen…" autocomplete="off">
<select id="region"><option value="">Alle Regionen</option></select>
</div>
</header>
<main>
<p class="note">Live-Daten: Hauptstadt, Einwohnerzahl, Sprachen, Region und Flagge. Politisches System, Religionen, HDI, BIP pro Kopf und Sicherheitslage werden über geprüfte externe Quellen je Land verlinkt.</p>
<div class="status" id="status">Lade Länderdaten…</div>
<div id="list"></div>
</main>
<script>
const FIELDS='name,translations,capital,population,languages,region,subregion,cca2,flag';
const list=document.getElementById('list'),status=document.getElementById('status'),q=document.getElementById('q'),regionSel=document.getElementById('region');
let countries=[];
const nf=new Intl.NumberFormat('de-DE');
function wiki(name){return 'https://de.wikipedia.org/wiki/Spezial:Suche?search='+encodeURIComponent(name);}
function links(c){
 const n=c.name.common, iso=c.cca2;
 return [
  ['Politisches System',wiki(n+'#Politik')],
  ['Religionen',wiki(n+'#Religion')],
  ['HDI', 'https://hdr.undp.org/data-center/country-insights#/countries/'+iso],
  ['BIP pro Kopf','https://data.worldbank.org/indicator/NY.GDP.PCAP.CD?locations='+iso],
  ['Sicherheitslage','https://www.auswaertiges-amt.de/de/aussenpolitik/laender/'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-node'],
  ['Wikipedia',wiki(n)]
 ];
}
function card(c){
 const langs=c.languages?Object.values(c.languages).join(', '):'—';
 const cap=c.capital?c.capital.join(', '):'—';
 const items=[['Hauptstadt',cap],['Einwohner',nf.format(c.population||0)],['Sprachen',langs],['Region',(c.subregion||c.region||'—')]];
 return `<article class="card"><div class="top"><div class="flag">${c.flag||''}</div><div><div class="name">${c.translations?.deu?.common||c.name.common}</div><div class="region">${c.name.official||''}</div></div></div><div class="grid">${items.map(i=>`<div class="item"><div class="k">${i[0]}</div><div class="v">${i[1]}</div></div>`).join('')}</div><div class="links">${links(c).map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join('')}</div></article>`;
}
function render(){
 const term=q.value.trim().toLowerCase(), reg=regionSel.value;
 const rows=countries.filter(c=>(!reg||c.region===reg)&&(!term||[c.name.common,c.translations?.deu?.common,c.capital?.join(' '),Object.values(c.languages||{}).join(' ')].join(' ').toLowerCase().includes(term)));
 list.innerHTML=rows.map(card).join('');
 status.textContent=`${rows.length} von ${countries.length} Ländern angezeigt`;
}
async function load(){
 try{
  const r=await fetch('https://restcountries.com/v3.1/all?fields='+FIELDS);
  if(!r.ok) throw new Error('HTTP '+r.status);
  countries=(await r.json()).sort((a,b)=>(a.translations?.deu?.common||a.name.common).localeCompare(b.translations?.deu?.common||b.name.common,'de'));
  [...new Set(countries.map(c=>c.region).filter(Boolean))].sort().forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;regionSel.append(o)});
  render();
 }catch(e){status.textContent='Laden fehlgeschlagen. Bitte Internetverbindung prüfen und Seite neu laden.'}
}
q.addEventListener('input',render);regionSel.addEventListener('change',render);load();
</script>
</body>
</html>
