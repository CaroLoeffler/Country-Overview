<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--line:#e4e7ec;--acc:#0f766e;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#a16207;--sea:#e6eff4;--land:#c9d3cd;--pin:#e11d48}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#eceff4;--mut:#98a2b3;--line:#262c36;--acc:#2dd4bf;--ok:#4ade80;--warn:#fb923c;--bad:#f87171;--info:#facc15;--sea:#1a2430;--land:#3a4753;--pin:#fb7185}}
.map{display:block;width:100%;max-width:240px;height:auto;max-height:260px;border-radius:10px;background:var(--sea);margin:12px 0 2px;border:1px solid var(--line)}
.land{fill:var(--land);stroke:var(--sea);stroke-width:.8;vector-effect:non-scaling-stroke}
.mapcap{font-size:12px;color:var(--mut);margin:0 0 4px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:9px 10px}
input[type=search]{flex:1 1 100%}
select{flex:1 1 40%}
button.upd{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;flex:1 1 100%}
@media (prefers-color-scheme:dark){button.upd{color:#04201c}}
button[disabled]{opacity:.6}
#status{font-size:12px;color:var(--mut);margin-top:6px}
main{padding:12px 14px calc(env(safe-area-inset-bottom) + 24px);max-width:900px;margin:0 auto}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.flag{font-size:28px;line-height:1}
.nm{flex:1;min-width:0}
.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:13px;color:var(--mut)}
.pop{font-size:13px;color:var(--mut);text-align:right;white-space:nowrap}
.det{padding:0 12px 12px;border-top:1px solid var(--line)}
dl{margin:10px 0 0;display:grid;grid-template-columns:132px 1fr;gap:6px 10px;font-size:14px}
dt{color:var(--mut);overflow-wrap:anywhere;hyphens:auto}dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.l0{color:var(--ok)}.l1{color:var(--info)}.l2{color:var(--warn)}.l3{color:var(--bad)}.ln{color:var(--mut)}
a{color:var(--acc)}
footer{font-size:12px;color:var(--mut);padding:8px 2px}
#count{font-size:13px;color:var(--mut);margin:0 2px 8px}
</style>
</head>

function loadWB(ind){
  return j('https://api.worldbank.org/v2/country/all/indicator/'+ind+'?format=json&per_page=400&mrnev=1').then(function(d){
    var m={};(d[1]||[]).forEach(function(r){if(r.countryiso3code&&r.value!=null)m[r.countryiso3code]={v:r.value,y:r.date}});return m;

function loadWikidata(){
  var q='SELECT ?iso3 (GROUP_CONCAT(DISTINCT ?govL;separator=", ") AS ?gov) (MAX(?hdi) AS ?hdiV) (GROUP_CONCAT(DISTINCT ?relL;separator=", ") AS ?rels) WHERE {'+
  '?c wdt:P298 ?iso3 . ?c wdt:P31 wd:Q3624078 . FILTER NOT EXISTS {?c wdt:P576 ?end}'+
  ' OPTIONAL {?c wdt:P122 ?g . ?g rdfs:label ?govL FILTER(lang(?govL)="de")}'+
  ' OPTIONAL {?c wdt:P1081 ?hdi}'+
  ' OPTIONAL {?c wdt:P140 ?r . ?r rdfs:label ?relL FILTER(lang(?relL)="de")}'+
  '} GROUP BY ?iso3';
  return j('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(q)).then(function(d){
    var m={};d.results.bindings.forEach(function(b){
      m[b.iso3.value]={gov:b.gov&&b.gov.value,hdi:b.hdiV&&b.hdiV.value?parseFloat(b.hdiV.value):null,rel:b.rels&&b.rels.value};
    });return m;
  });
}
/* Sicherheitslage: erst Auswärtiges Amt (Browser-Zugriff wird dort oft per CORS blockiert),

function loadAA(){
  return j('https://www.auswaertiges-amt.de/opendata/travelwarning').then(function(d){
    var r=d.response||d,out={};
    Object.keys(r).forEach(function(k){var v=r[k];
      if(v&&typeof v==='object'){var c=v.iso3CountryCode||v.countryCode;if(c)out[String(c).toUpperCase()]=v}});
    if(!Object.keys(out).length)throw new Error('leer');
    return {type:'aa',data:out};
  });
}
function loadTA(){
  return j('https://www.travel-advisory.info/api').then(function(d){
    var out={},x=d.data||{};
    Object.keys(x).forEach(function(k){var a=x[k]&&x[k].advisory;if(a&&a.score!=null)out[k.toUpperCase()]=a.score});
    if(!Object.keys(out).length)throw new Error('leer');
    return {type:'ta',data:out};
  });
}
function loadSec(){
  return loadAA().catch(function(e1){
    return loadTA().catch(function(e2){
      throw new Error('Auswärtiges Amt: '+e1.message+'; travel-advisory.info: '+e2.message);
    });
  });
}

function secOf(sec,r){
  if(!sec)return null;
  if(sec.type==='ta'){
    var s=sec.data[r.iso2];if(s==null)return null;
    var lv=s<2.5?0:s<3.5?1:s<4.5?2:3;
    var tx=['Geringes Risiko','Erhöhte Vorsicht','Hohes Risiko','Sehr hohes Risiko'][lv];
    return {l:String(lv),t:tx+' (Score '+String(s).replace('.',',')+' von 5, travel-advisory.info)'};
  }
  var v=sec.data[r.iso3]||sec.data[r.iso2];
  if(!v)return {l:'0',t:'Keine Warnung des Auswärtigen Amts'};
  if(v.warning)return {l:'3',t:'Reisewarnung'};
  if(v.partialWarning)return {l:'2',t:'Teilreisewarnung'};
  if(v.situationWarning)return {l:'2',t:'Sicherheitshinweis (Lage)'};
  if(v.situationPartWarning)return {l:'1',t:'Teilweise Sicherheitshinweise'};
  return {l:'0',t:'Keine Warnung des Auswärtigen Amts'};
}

    try{localStorage.setItem(CACHE_KEY,JSON.stringify({ts:state.ts,rows:state.rows,src:state.src}))}catch(e){}
    render();
    if(errs.length)setStatus('Teilweise aktualisiert. Nicht erreichbar (bisherige Werte bleiben): '+errs.join(' · '));
  }).catch(function(e){setStatus('Fehler: '+e.message)}).then(function(){
    b.disabled=false;b.textContent='↻ Daten aktualisieren';
  });
}

function usd(v){return v==null?'–':'$ '+nf.format(Math.round(v))}
function num(v){return v==null?'–':nf.format(v)}

/* Lagekarte: schematische Kontinentumrisse (Kartenvorlage #wm im Seitenanfang), roter Punkt = Hauptstadt */
var VB={'Afrika':[-20,-38,75,75],'Europa':[-25,-72,87,39],'Asien':[25,-55,132,67],'Amerika':[-130,-60,100,120],'Ozeanien':[105,-10,90,58]};
function mapSvg(r){
  var v=VB[r.region];if(!v||r.lat==null||r.lon==null)return '';
  var lon=r.lon;if(r.region==='Ozeanien'&&lon<0)lon+=360;
  var cx=lon,cy=-r.lat,rad=v[2]*0.02;
  return '<svg class="map" viewBox="'+v.join(' ')+'" role="img" aria-label="Lage von '+esc(r.name)+'"><use href="#wm"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+(rad*2.2).toFixed(2)+'" fill="none" stroke="var(--pin)" stroke-width="1.2" vector-effect="non-scaling-stroke" opacity=".55"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+rad.toFixed(2)+'" fill="var(--pin)"/></svg>';
}

function render(){
  var q=$('#q').value.trim().toLowerCase(),rg=$('#reg').value,so=$('#sort').value;
  var rows=state.rows.filter(function(r){
    if(rg&&r.region!==rg)return false;
    if(!q)return true;
    return (r.name+' '+r.cap+' '+r.langs.join(' ')+' '+(r.sport||'')+' '+(r.sights||'')+' '+(r.food||'')).toLowerCase().indexOf(q)>-1;
  });
  rows.sort(function(a,b){
    if(so==='name')return a.name.localeCompare(b.name,'de');
    var x=a[so]==null?-1:a[so],y=b[so]==null?-1:b[so];return y-x;
  });
  var sel=$('#reg');
  if(sel.options.length<=1){Object.keys(RG).map(function(k){return RG[k]}).sort().forEach(function(r){var o=document.createElement('option');o.value=r;o.textContent=r;sel.appendChild(o)})}
  $('#count').textContent=rows.length+' von '+state.rows.length+' Ländern';
  $('#list').innerHTML=rows.map(function(r){
    var q1=encodeURIComponent(r.name);
    return '<details data-i="'+esc(r.iso3)+'"><summary><span class="flag">'+esc(r.flag)+'</span>'+
      '<span class="nm"><b>'+esc(r.name)+'</b><span>'+esc(r.cap)+' · '+esc(r.region)+'</span></span>'+
      '<span class="pop">'+(r.pop!=null?num(r.pop)+'<br>Einw.':'')+'</span></summary><div class="det">'+mapSvg(r)+'<div class="mapcap">Lage in '+esc(r.region)+' (roter Punkt = Hauptstadt, schematische Karte)</div><dl>'+
      '<dt>Hauptstadt</dt><dd>'+esc(r.cap)+'</dd>'+
      '<dt>Politisches System</dt><dd>'+(esc(r.gov)||'–')+'</dd>'+
      '<dt>Einwohner</dt><dd>'+num(r.pop)+'</dd>'+
      '<dt>BIP pro Kopf</dt><dd>'+usd(r.gdp)+(r.gdpY?' <small>('+esc(r.gdpY)+')</small>':'')+'</dd>'+
      '<dt>Ø Einkommen (BNE/Kopf)</dt><dd>'+usd(r.gni)+(r.gniY?' <small>('+esc(r.gniY)+')</small>':'')+'</dd>'+
      '<dt>HDI</dt><dd>'+(r.hdi!=null?r.hdi.toFixed(3).replace('.',',')+' <small>('+hdiCat(r.hdi)+')</small>':'–')+'</dd>'+
      '<dt>Geburtenrate</dt><dd>'+(r.tfr!=null?r.tfr.toFixed(2).replace('.',',').replace(/0$/,'')+' Kinder pro Frau'+(r.tfrY?' <small>('+esc(r.tfrY)+')</small>':''):'–')+'</dd>'+
      '<dt>Sprachen</dt><dd>'+(esc(r.langs.join(', '))||'–')+'</dd>'+
      '<dt>Religionen</dt><dd>'+(esc(r.rel)||'<small>keine Angabe – <a target="_blank" rel="noopener" href="https://de.wikipedia.org/wiki/'+q1+'#Religionen">Wikipedia</a></small>')+'</dd>'+
      '<dt>Sicherheitslage</dt><dd><span class="tag l'+r.sec.l+'">'+esc(r.sec.t)+'</span><br><small><a target="_blank" rel="noopener" href="https://www.auswaertiges-amt.de/de/ReiseUndSicherheit">Auswärtiges Amt: Reise- und Sicherheitshinweise</a></small></dd>'+
      '<dt>Kultur</dt><dd><span class="wk">'+(esc(r.cul)||'…')+'</span><div><small><a target="_blank" rel="noopener" href="https://de.wikipedia.org/w/index.php?search=Kultur+'+q1+'">Kultur &amp; Gesellschaft nachlesen</a></small></div></dd>'+
      '<dt>Beliebte Sportarten</dt><dd>'+(esc(r.sport)||'–')+'</dd>'+
      '<dt>Sehenswürdigkeiten</dt><dd>'+(esc(r.sights)||'–')+'</dd>'+
      '<dt>Kulinarisches</dt><dd>'+(esc(r.food)||'–')+'</dd>'+
      '</dl></div></details>';
  }).join('');
  if(state.ts){
    var t=new Date(state.ts).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'});
    setStatus('Stand der Daten: '+t);
  }else setStatus('Eingebauter Datenstand (Näherungswerte, nicht live geprüft). Für aktuelle Zahlen „Daten aktualisieren“ tippen.');
  var s=Object.keys(state.src||{}).map(function(k){return (state.src[k]?'✓ ':'✗ ')+k}).join(' · ');
  $('#foot').textContent=(s?'Zuletzt erreichte Quellen: '+s+'. ':'')+'Ohne Aktualisierung sind alle Werte gerundete Näherungen (BIP/Einkommen in USD, ca. 2024). Mit „(Schätzung)“ markierte Sicherheitslagen unbedingt beim Auswärtigen Amt gegenprüfen. Nach der Aktualisierung: Einwohner, BIP und Einkommen von der Weltbank (letzter verfügbarer Wert), HDI/Staatsform/Religionen aus Wikidata, Sicherheitslage vom Auswärtigen Amt oder ersatzweise von travel-advisory.info. Geburtenrate ebenfalls von der Weltbank. Sprachen, Sport, Sehenswürdigkeiten, Küche und Kultur-Stichworte sind fest eingebaut; die Lagekarte ist schematisch.';
}

$('#list').addEventListener('toggle',function(e){
  var d=e.target;if(!d.open||!d.dataset||!d.dataset.i)return;
  var r=state.rows.filter(function(x){return x.iso3===d.dataset.i})[0];if(!r)return;
  var el=d.querySelector('.wk');
  if(r.cul)return;
  if(state.wiki[r.iso3]){el.textContent=state.wiki[r.iso3];return}
  fetch('https://de.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(r.name)).then(function(x){return x.json()}).then(function(s){
    var t=(s.extract||'').split('. ').slice(0,2).join('. ');
    state.wiki[r.iso3]=t||'Kein Kurzporträt gefunden.';el.textContent=state.wiki[r.iso3];
  }).catch(function(){el.textContent='Kurzporträt derzeit nicht ladbar.'});
},true);

['q','reg','sort'].forEach(function(id){$('#'+id).addEventListener('input',render)});
$('#upd').addEventListener('click',refresh);

var cached=null;
try{cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(e){}
if(cached&&cached.rows&&cached.rows.length){state.rows=cached.rows;state.ts=cached.ts;state.src=cached.src||{};render()}
else{render();refresh()}
})();
</script>
</body>
</html>
