<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Länder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<title>Länder-Atlas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--line:#e4e7ec;--acc:#0f766e;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#a16207}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#eceff4;--mut:#98a2b3;--line:#262c36;--acc:#2dd4bf;--ok:#4ade80;--warn:#fb923c;--bad:#f87171;--info:#facc15}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:9px 10px}
input[type=search]{flex:1 1 100%}
select{flex:1 1 40%}
button.upd{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;flex:1 1 100%}
@media (prefers-color-scheme:dark){button.upd{color:#04201c}}
button[disabled]{opacity:.6}
#status{font-size:12px;color:var(--mut);margin-top:6px}
main{padding:12px 14px calc(env(safe-area-inset-bottom) + 24px);max-width:900px;margin:0 auto}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.flag{font-size:28px;line-height:1}
.nm{flex:1;min-width:0}
.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:13px;color:var(--mut)}
.pop{font-size:13px;color:var(--mut);text-align:right;white-space:nowrap}
.det{padding:0 12px 12px;border-top:1px solid var(--line)}
dl{margin:10px 0 0;display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px}
dt{color:var(--mut)}dd{margin:0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.l0{color:var(--ok)}.l1{color:var(--info)}.l2{color:var(--warn)}.l3{color:var(--bad)}.ln{color:var(--mut)}
.sum{font-size:13px;color:var(--mut);margin-top:8px}
a{color:var(--acc)}
footer{font-size:12px;color:var(--mut);padding:8px 2px}
#count{font-size:13px;color:var(--mut);margin:0 2px 8px}
</style>
</head>
<body>
<header>
  <h1>🌍 Länder-Atlas</h1>
  <div class="row">
    <input id="q" type="search" placeholder="Land, Hauptstadt oder Sprache suchen …" autocomplete="off">
    <select id="reg"><option value="">Alle Regionen</option></select>
    <select id="sort">
      <option value="name">Sortierung: Name</option>
      <option value="pop">Einwohner</option>
      <option value="gdp">BIP pro Kopf</option>
      <option value="gni">Einkommen pro Kopf</option>
      <option value="hdi">HDI</option>
    </select>
    <button class="upd" id="upd">↻ Daten aktualisieren</button>
  </div>
  <div id="status">Lade …</div>
</header>
<main>
  <div id="count"></div>
  <div id="list"></div>
  <footer id="foot"></footer>
</main>

<script>
(function(){
'use strict';
var CACHE_KEY='laender-atlas-v1';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})};
var REG={Africa:'Afrika',Americas:'Amerika',Asia:'Asien',Europe:'Europa',Oceania:'Ozeanien',Antarctic:'Antarktis'};
var nf=new Intl.NumberFormat('de-DE');
var state={rows:[],ts:null,src:{},wiki:{}};
var langNames=null;
try{langNames=new Intl.DisplayNames(['de'],{type:'language',fallback:'code'})}catch(e){}

function j(url){return fetch(url).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}

function loadRest(){
  return j('https://restcountries.com/v3.1/all?fields=cca3,cca2,name,translations,capital,population,languages,region,flag,independent');
}
function loadWB(ind){
  return j('https://api.worldbank.org/v2/country/all/indicator/'+ind+'?format=json&per_page=400&mrnev=1').then(function(d){
    var m={};(d[1]||[]).forEach(function(r){if(r.countryiso3code&&r.value!=null)m[r.countryiso3code]={v:r.value,y:r.date}});return m;
  });
}
function loadWikidata(){
  var q='SELECT ?iso3 (GROUP_CONCAT(DISTINCT ?capL;separator=", ") AS ?cap) (GROUP_CONCAT(DISTINCT ?govL;separator=", ") AS ?gov) (MAX(?hdi) AS ?hdiV) (GROUP_CONCAT(DISTINCT ?relL;separator=", ") AS ?rels) WHERE {'+
  '?c wdt:P298 ?iso3 . ?c wdt:P31 wd:Q3624078 . FILTER NOT EXISTS {?c wdt:P576 ?end}'+
  ' OPTIONAL {?c wdt:P36 ?cp . ?cp rdfs:label ?capL FILTER(lang(?capL)="de")}'+
  ' OPTIONAL {?c wdt:P122 ?g . ?g rdfs:label ?govL FILTER(lang(?govL)="de")}'+
  ' OPTIONAL {?c wdt:P1081 ?hdi}'+
  ' OPTIONAL {?c wdt:P140 ?r . ?r rdfs:label ?relL FILTER(lang(?relL)="de")}'+
  '} GROUP BY ?iso3';
  return j('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(q)).then(function(d){
    var m={};d.results.bindings.forEach(function(b){
      m[b.iso3.value]={cap:b.cap&&b.cap.value,gov:b.gov&&b.gov.value,hdi:b.hdiV&&b.hdiV.value?parseFloat(b.hdiV.value):null,rel:b.rels&&b.rels.value};
    });return m;
  });
}
function loadAA(){
  return j('https://www.auswaertiges-amt.de/opendata/travelwarning').then(function(d){
    var r=d.response||d,out={};
    Object.keys(r).forEach(function(k){var v=r[k];
      if(v&&typeof v==='object'){var c=v.iso3CountryCode||v.countryCode;if(c)out[String(c).toUpperCase()]=v}});
    if(!Object.keys(out).length)throw new Error('leer');
    return out;
  });
}

function secOf(aa,r){
  if(!aa)return {l:'n',t:'Keine Daten geladen'};
  var v=aa[r.iso3]||aa[r.iso2];
  if(!v)return {l:'0',t:'Keine Warnung des Auswärtigen Amts'};
  if(v.warning)return {l:'3',t:'Reisewarnung'};
  if(v.partialWarning)return {l:'2',t:'Teilreisewarnung'};
  if(v.situationWarning)return {l:'2',t:'Sicherheitshinweis (Lage)'};
  if(v.situationPartWarning)return {l:'1',t:'Teilweise Sicherheitshinweise'};
  return {l:'0',t:'Keine Warnung des Auswärtigen Amts'};
}
function hdiCat(h){if(h==null)return '';return h>=0.8?'sehr hoch':h>=0.7?'hoch':h>=0.55?'mittel':'niedrig'}
function langs(c){
  var o=c.languages||{};
  return Object.keys(o).map(function(code){
    var n=null;try{if(langNames){n=langNames.of(code);if(n===code)n=null}}catch(e){}
    return n||o[code];
  });
}

function setStatus(t){$('#status').textContent=t}

function refresh(){
  var b=$('#upd');b.disabled=true;b.textContent='Aktualisiere …';setStatus('Hole Daten aus vier Quellen …');
  return Promise.allSettled([loadRest(),loadWB('NY.GDP.PCAP.CD'),loadWB('NY.GNP.PCAP.CD'),loadWikidata(),loadAA()]).then(function(res){
    var names=['REST Countries','Weltbank BIP','Weltbank Einkommen','Wikidata','Auswärtiges Amt'];
    var src={};res.forEach(function(r,i){src[names[i]]=r.status==='fulfilled'});
    if(res[0].status!=='fulfilled'){
      setStatus('Grunddaten konnten nicht geladen werden. Bitte Verbindung prüfen und erneut versuchen.');
      return;
    }
    var gdp=res[1].value||{},gni=res[2].value||{},wd=res[3].value||{},aa=res[4].status==='fulfilled'?res[4].value:null;
    var rows=res[0].value.filter(function(c){return c.independent===true}).map(function(c){
      var w=wd[c.cca3]||{};
      var r={iso3:c.cca3,iso2:c.cca2,flag:c.flag||'',
        name:(c.translations&&c.translations.deu&&c.translations.deu.common)||c.name.common,
        cap:w.cap||(c.capital||[]).join(', ')||'–',
        gov:w.gov||'',hdi:w.hdi!=null?w.hdi:null,rel:w.rel||'',
        pop:c.population,region:REG[c.region]||c.region||'',
        langs:langs(c),
        gdp:gdp[c.cca3]?gdp[c.cca3].v:null,gdpY:gdp[c.cca3]?gdp[c.cca3].y:'',
        gni:gni[c.cca3]?gni[c.cca3].v:null,gniY:gni[c.cca3]?gni[c.cca3].y:''};
      r.sec=secOf(aa,r);return r;
    });
    state.rows=rows;state.ts=Date.now();state.src=src;
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({ts:state.ts,rows:rows,src:src}))}catch(e){}
    render();
  }).catch(function(e){setStatus('Fehler: '+e.message)}).then(function(){
    b.disabled=false;b.textContent='↻ Daten aktualisieren';
  });
}

function usd(v){return v==null?'–':'$ '+nf.format(Math.round(v))}

function render(){
  var q=$('#q').value.trim().toLowerCase(),rg=$('#reg').value,so=$('#sort').value;
  var rows=state.rows.filter(function(r){
    if(rg&&r.region!==rg)return false;
    if(!q)return true;
    return (r.name+' '+r.cap+' '+r.langs.join(' ')).toLowerCase().indexOf(q)>-1;
  });
  rows.sort(function(a,b){
    if(so==='name')return a.name.localeCompare(b.name,'de');
    var k={pop:'pop',gdp:'gdp',gni:'gni',hdi:'hdi'}[so];
    var x=a[k]==null?-1:a[k],y=b[k]==null?-1:b[k];return y-x;
  });
  var regs={};state.rows.forEach(function(r){regs[r.region]=1});
  var sel=$('#reg');
  if(sel.options.length<=1){Object.keys(regs).sort().forEach(function(r){var o=document.createElement('option');o.value=r;o.textContent=r;sel.appendChild(o)})}
  $('#count').textContent=rows.length+' von '+state.rows.length+' Ländern';
  $('#list').innerHTML=rows.map(function(r){
    var q1=encodeURIComponent(r.name);
    return '<details data-i="'+esc(r.iso3)+'"><summary><span class="flag">'+esc(r.flag)+'</span>'+
      '<span class="nm"><b>'+esc(r.name)+'</b><span>'+esc(r.cap)+' · '+esc(r.region)+'</span></span>'+
      '<span class="pop">'+nf.format(r.pop)+'<br>Einw.</span></summary><div class="det"><dl>'+
      '<dt>Hauptstadt</dt><dd>'+esc(r.cap)+'</dd>'+
      '<dt>Politisches System</dt><dd>'+(esc(r.gov)||'–')+'</dd>'+
      '<dt>Einwohner</dt><dd>'+nf.format(r.pop)+'</dd>'+
      '<dt>BIP pro Kopf</dt><dd>'+usd(r.gdp)+(r.gdpY?' <small>('+esc(r.gdpY)+')</small>':'')+'</dd>'+
      '<dt>Ø Einkommen (BNE/Kopf)</dt><dd>'+usd(r.gni)+(r.gniY?' <small>('+esc(r.gniY)+')</small>':'')+'</dd>'+
      '<dt>HDI</dt><dd>'+(r.hdi!=null?r.hdi.toFixed(3).replace('.',',')+' <small>('+hdiCat(r.hdi)+')</small>':'–')+'</dd>'+
      '<dt>Sprachen</dt><dd>'+(esc(r.langs.join(', '))||'–')+'</dd>'+
      '<dt>Religionen</dt><dd>'+(esc(r.rel)||'<small>keine Angabe in Wikidata – <a target="_blank" rel="noopener" href="https://de.wikipedia.org/wiki/'+q1+'#Religionen">Wikipedia</a></small>')+'</dd>'+
      '<dt>Sicherheitslage</dt><dd><span class="tag l'+r.sec.l+'">'+esc(r.sec.t)+'</span><br><small><a target="_blank" rel="noopener" href="https://www.auswaertiges-amt.de/de/ReiseUndSicherheit">Reise- und Sicherheitshinweise</a></small></dd>'+
      '<dt>Kultur</dt><dd><span class="wk">…</span><div><small><a target="_blank" rel="noopener" href="https://de.wikipedia.org/w/index.php?search=Kultur+'+q1+'">Kultur &amp; Gesellschaft nachlesen</a></small></div></dd>'+
      '</dl></div></details>';
  }).join('');
  var t=state.ts?new Date(state.ts).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}):'–';
  setStatus('Stand der Daten: '+t);
  var s=Object.keys(state.src||{}).map(function(k){return (state.src[k]?'✓ ':'✗ ')+k}).join(' · ');
  $('#foot').textContent='Quellen: '+s+'. Werte sind Näherungen aus öffentlichen Datenbanken (Weltbank: letzter verfügbarer Wert; HDI und Staatsform aus Wikidata).';
}

$('#list').addEventListener('toggle',function(e){
  var d=e.target;if(!d.open||!d.dataset||!d.dataset.i)return;
  var r=state.rows.filter(function(x){return x.iso3===d.dataset.i})[0];if(!r)return;
  var el=d.querySelector('.wk');
  if(state.wiki[r.iso3]){el.textContent=state.wiki[r.iso3];return}
  fetch('https://de.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(r.name)).then(function(x){return x.json()}).then(function(s){
    var t=(s.extract||'').split('. ').slice(0,2).join('. ');
    state.wiki[r.iso3]=t||'Kein Kurzporträt gefunden.';el.textContent=state.wiki[r.iso3];
  }).catch(function(){el.textContent='Kurzporträt derzeit nicht ladbar.'});
},true);

['q','reg','sort'].forEach(function(id){$('#'+id).addEventListener('input',render)});
$('#upd').addEventListener('click',refresh);

try{
  var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
  if(c&&c.rows&&c.rows.length){state.rows=c.rows;state.ts=c.ts;state.src=c.src||{};render();}
  else refresh();
}catch(e){refresh()}
})();
</script>
</body>
</html>
